<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercices C — MPI</title>
<meta name="description" content="Exercices de programmation en C pour le programme d'informatique de MPI : listes chaînées, structures de données, algorithmique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#EAEFEC;
  --bg-grid:rgba(23,32,36,0.06);
  --paper:#FFFFFF;
  --paper-border:#D8E0DC;
  --ink:#172024;
  --ink-soft:#55635F;
  --ink-faint:#8A9793;
  --accent:#0E7268;
  --accent-strong:#0A5951;
  --accent-soft:#E1F1EE;
  --nav-bg:#12201E;
  --nav-text:#CBD9D5;
  --nav-text-dim:#75857F;
  --nav-active:#1D3634;
  --code-bg:#101A20;
  --code-text:#DCE7E3;
  --tok-comment:#74918C;
  --tok-string:#3F8A5C;
  --tok-keyword:#2F63B8;
  --tok-type:#9A6B0C;
  --tok-number:#B5562F;
  --tok-preproc:#7A4FA8;
  --tok-constant:#9A6B0C;
  --diff-easy:#0E7268; --diff-easy-bg:#E1F1EE;
  --diff-medium:#A9740F; --diff-medium-bg:#F6ECD8;
  --diff-hard:#8C3B67; --diff-hard-bg:#F5E4EE;
  --shadow:0 1px 2px rgba(23,32,36,0.08);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513;
    --bg-grid:rgba(255,255,255,0.045);
    --paper:#16201E;
    --paper-border:#263431;
    --ink:#E6EDE9;
    --ink-soft:#9FB0AB;
    --ink-faint:#617069;
    --accent:#3FCDB8;
    --accent-strong:#6EDFCC;
    --accent-soft:rgba(63,205,184,0.14);
    --nav-bg:#0A1211;
    --nav-text:#B9C9C4;
    --nav-text-dim:#5C6C66;
    --nav-active:#16302C;
    --code-bg:#0B1214;
    --code-text:#DCE7E3;
    --tok-comment:#6C8B84;
    --tok-string:#8FCB9E;
    --tok-keyword:#8FC0F5;
    --tok-type:#E8C06E;
    --tok-number:#E6A984;
    --tok-preproc:#D3AEEF;
    --tok-constant:#E8C06E;
    --diff-easy:#3FCDB8; --diff-easy-bg:rgba(63,205,184,0.14);
    --diff-medium:#D8A23F; --diff-medium-bg:rgba(216,162,63,0.14);
    --diff-hard:#C7679B; --diff-hard-bg:rgba(199,103,155,0.14);
    --shadow:0 1px 3px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513;
  --bg-grid:rgba(255,255,255,0.045);
  --paper:#16201E;
  --paper-border:#263431;
  --ink:#E6EDE9;
  --ink-soft:#9FB0AB;
  --ink-faint:#617069;
  --accent:#3FCDB8;
  --accent-strong:#6EDFCC;
  --accent-soft:rgba(63,205,184,0.14);
  --nav-bg:#0A1211;
  --nav-text:#B9C9C4;
  --nav-text-dim:#5C6C66;
  --nav-active:#16302C;
  --code-bg:#0B1214;
  --code-text:#DCE7E3;
  --tok-comment:#6C8B84;
  --tok-string:#8FCB9E;
  --tok-keyword:#8FC0F5;
  --tok-type:#E8C06E;
  --tok-number:#E6A984;
  --tok-preproc:#D3AEEF;
  --tok-constant:#E8C06E;
  --diff-easy:#3FCDB8; --diff-easy-bg:rgba(63,205,184,0.14);
  --diff-medium:#D8A23F; --diff-medium-bg:rgba(216,162,63,0.14);
  --diff-hard:#C7679B; --diff-hard-bg:rgba(199,103,155,0.14);
  --shadow:0 1px 3px rgba(0,0,0,0.4);
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(var(--bg-grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.6;
}
a{color:var(--accent);}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);line-height:1.25;margin:0 0 .5em;}
p{margin:0 0 1em;}
button{font-family:var(--font-display);cursor:pointer;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:300px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-text);
  position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  padding:22px 16px 40px;
}
.main{flex:1;min-width:0;}
.main-inner{max-width:720px;margin:0 auto;padding:52px 32px 100px;}
.backdrop{display:none;}

.menu-toggle{
  display:none;position:fixed;top:14px;left:14px;z-index:60;
  background:var(--nav-bg);color:var(--nav-text);border:1px solid var(--nav-active);
  border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
}

@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:55;transform:translateX(-104%);transition:transform .25s ease;width:300px;max-width:82vw;}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:inline-flex;align-items:center;gap:6px;}
  .main-inner{padding:76px 20px 80px;}
  .backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;}
}

/* ============ SIDEBAR ============ */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--nav-active);margin-bottom:16px;}
.brand-mark{width:34px;height:34px;flex-shrink:0;}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;line-height:1.15;}
.brand-sub{font-size:11.5px;color:var(--nav-text-dim);margin-top:2px;}

.overall-progress{padding:0 8px 18px;}
.overall-progress .label{font-size:11.5px;color:var(--nav-text-dim);margin-bottom:6px;display:flex;justify-content:space-between;}
.bar{height:5px;border-radius:3px;background:var(--nav-active);overflow:hidden;}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease;}

.search-wrap{padding:0 8px 14px;}
.search-wrap input{
  width:100%;background:var(--nav-active);border:1px solid transparent;color:var(--nav-text);
  padding:8px 10px;border-radius:7px;font-family:var(--font-body);font-size:13.5px;
}
.search-wrap input::placeholder{color:var(--nav-text-dim);}
.search-wrap input:focus{border-color:var(--accent);}

.home-link{
  display:block;padding:9px 10px;margin:0 0 10px;border-radius:7px;font-family:var(--font-display);
  font-size:13.5px;font-weight:600;color:var(--nav-text);text-decoration:none;
}
.home-link:hover,.home-link.active{background:var(--nav-active);color:#fff;}

nav.chapters details{margin-bottom:3px;border-radius:8px;overflow:hidden;}
nav.chapters summary{
  list-style:none;display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;
  font-family:var(--font-display);font-size:13.5px;font-weight:600;color:var(--nav-text);border-radius:7px;
}
nav.chapters summary:hover{background:var(--nav-active);}
nav.chapters summary::-webkit-details-marker{display:none;}
.chev{width:9px;height:9px;flex-shrink:0;border-right:1.6px solid var(--nav-text-dim);border-bottom:1.6px solid var(--nav-text-dim);transform:rotate(-45deg);transition:transform .18s ease;margin-left:1px;}
details[open] > summary .chev{transform:rotate(45deg);}
.chapter-title{flex:1;}
.chapter-count{font-family:var(--font-mono);font-size:10.5px;color:var(--nav-text-dim);font-weight:400;}

ul.exlist{list-style:none;margin:2px 0 10px;padding:0 0 0 27px;display:flex;flex-direction:column;gap:1px;}
ul.exlist li a{
  display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--nav-text-dim);
  font-size:13px;padding:6px 8px;border-radius:6px;
}
ul.exlist li a:hover{background:var(--nav-active);color:var(--nav-text);}
ul.exlist li a.active{background:var(--nav-active);color:#fff;}
.dot{width:8px;height:8px;border-radius:50%;border:1.6px solid var(--nav-text-dim);flex-shrink:0;}
ul.exlist li a.done .dot{background:var(--accent);border-color:var(--accent);}
ul.exlist li a.active .dot{border-color:var(--accent);}
.empty-note{padding:2px 0 10px 27px;font-size:12px;color:var(--nav-text-dim);font-style:italic;}

/* ============ HERO / HOME ============ */
.eyebrow{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);letter-spacing:.02em;margin-bottom:10px;}
.hero h1{font-size:35px;letter-spacing:-0.01em;}
.hero p.lead{font-size:17.5px;color:var(--ink-soft);max-width:56ch;}
.hero-diagram{margin:28px 0 8px;}
.hero-diagram svg{width:100%;height:auto;display:block;}

.callout{
  background:var(--accent-soft);border:1px solid var(--paper-border);border-left:3px solid var(--accent);
  border-radius:8px;padding:14px 16px;margin:20px 0;font-size:14.5px;color:var(--ink-soft);
}
.callout strong{color:var(--ink);}

.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px;}
@media (max-width:600px){.chapter-grid{grid-template-columns:1fr;}}
.chapter-card{
  display:block;text-decoration:none;background:var(--paper);border:1px solid var(--paper-border);
  border-radius:10px;padding:16px 17px;box-shadow:var(--shadow);
}
.chapter-card:hover{border-color:var(--accent);}
.chapter-card h3{font-size:15px;margin-bottom:5px;color:var(--ink);}
.chapter-card p{font-size:13px;color:var(--ink-soft);margin:0 0 8px;line-height:1.5;}
.chapter-card .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.chapter-card .meta.soon{color:var(--ink-faint);font-style:italic;}

/* ============ CHAPTER PAGE ============ */
.crumb{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;font-family:var(--font-display);}
.crumb a{color:var(--ink-faint);text-decoration:none;}
.crumb a:hover{color:var(--accent);}
.chapter-head h1{font-size:28px;}
.chapter-head p.desc{color:var(--ink-soft);font-size:16px;max-width:60ch;}
.intro-block{margin:22px 0 6px;}
.intro-block p{color:var(--ink-soft);}

.ex-card-list{margin-top:22px;display:flex;flex-direction:column;gap:8px;}
.ex-card{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--paper-border);
  border-radius:9px;padding:13px 15px;text-decoration:none;box-shadow:var(--shadow);
}
.ex-card:hover{border-color:var(--accent);}
.ex-card .dot{width:9px;height:9px;}
.ex-card .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);width:20px;flex-shrink:0;}
.ex-card .title{flex:1;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);}
.empty-chapter{
  margin-top:22px;padding:22px 20px;border:1px dashed var(--paper-border);border-radius:10px;
  color:var(--ink-faint);font-size:14.5px;font-style:italic;
}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;font-family:var(--font-display);font-weight:600;font-size:11px;
  padding:3px 9px;border-radius:20px;letter-spacing:.01em;
}
.badge.easy{color:var(--diff-easy);background:var(--diff-easy-bg);}
.badge.medium{color:var(--diff-medium);background:var(--diff-medium-bg);}
.badge.hard{color:var(--diff-hard);background:var(--diff-hard-bg);}

/* ============ EXERCISE PAGE ============ */
.ex-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;}
.ex-head h1{font-size:25px;margin:0;flex:1;min-width:200px;}
.statement{font-size:16.5px;color:var(--ink);margin:18px 0 24px;}
.statement code{font-family:var(--font-mono);font-size:.87em;background:var(--accent-soft);padding:1px 5px;border-radius:4px;color:var(--accent-strong);}

.done-toggle{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:12.5px;font-weight:600;
  color:var(--ink-soft);background:var(--paper);border:1px solid var(--paper-border);border-radius:20px;padding:6px 12px 6px 8px;
}
.done-toggle input{width:15px;height:15px;accent-color:var(--accent);}
.done-toggle.on{color:var(--accent-strong);border-color:var(--accent);}

.section-label{font-family:var(--font-display);font-weight:600;font-size:12.5px;text-transform:none;color:var(--ink-faint);margin:26px 0 8px;letter-spacing:.01em;}

/* code blocks */
.code-block{background:var(--code-bg);border-radius:10px;overflow:hidden;margin:10px 0 6px;box-shadow:var(--shadow);}
.code-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.code-lang{font-family:var(--font-mono);font-size:11px;color:#8296a0;letter-spacing:.03em;}
.copy-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#c9d4d1;font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;font-family:var(--font-display);}
.copy-btn:hover{border-color:rgba(255,255,255,.4);}
.code-block pre{margin:0;padding:14px 16px;overflow-x:auto;}
.code-block code{font-family:var(--font-mono);font-size:13px;line-height:1.65;color:var(--code-text);white-space:pre;}
.code-block code[contenteditable]:focus {outline: none;} 
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-string{color:var(--tok-string);}
.tok-keyword{color:var(--tok-keyword);font-weight:600;}
.tok-type{color:var(--tok-type);}
.tok-number{color:var(--tok-number);}
.tok-preproc{color:var(--tok-preproc);}
.tok-constant{color:var(--tok-constant);}

/* disclosures */
details.disclosure{border:1px solid var(--paper-border);border-radius:10px;margin:10px 0;background:var(--paper);overflow:hidden;}
details.disclosure summary{
  list-style:none;padding:12px 15px;cursor:pointer;display:flex;align-items:center;gap:9px;
  font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink);
}
details.disclosure summary::-webkit-details-marker{display:none;}
details.disclosure summary .plus{width:16px;height:16px;flex-shrink:0;position:relative;}
details.disclosure summary .plus::before,details.disclosure summary .plus::after{content:"";position:absolute;background:var(--accent);border-radius:1px;}
details.disclosure summary .plus::before{width:12px;height:2px;top:7px;left:2px;}
details.disclosure summary .plus::after{width:2px;height:12px;top:2px;left:7px;transition:transform .15s ease;}
details.disclosure[open] summary .plus::after{transform:scaleY(0);}
details.disclosure .disclosure-body{padding:0 16px 16px;font-size:15px;color:var(--ink-soft);}
details.disclosure.hint summary{color:var(--ink-soft);font-size:13px;}
details.disclosure.solution summary{color:var(--accent-strong);}

.hint-group{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;}

.ex-nav{display:flex;justify-content:space-between;gap:12px;margin-top:38px;padding-top:20px;border-top:1px solid var(--paper-border);}
.ex-nav a{
  flex:1;text-decoration:none;color:var(--ink-soft);font-size:13px;border:1px solid var(--paper-border);
  border-radius:9px;padding:11px 13px;background:var(--paper);
}
.ex-nav a:hover{border-color:var(--accent);}
.ex-nav a .dir{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:3px;}
.ex-nav a.next{text-align:right;margin-left:auto;}
.ex-nav a.placeholder{visibility:hidden;}

footer.sitefoot{max-width:720px;margin:60px auto 0;padding:20px 32px 40px;color:var(--ink-faint);font-size:12.5px;text-align:center;}

/* tabs */
.tabs{display:flex;gap:4px;margin:0 0 16px;background:var(--nav-active);padding:4px;border-radius:9px;}
.tab-btn{flex:1;text-align:center;padding:7px 0;border-radius:6px;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--nav-text-dim);text-decoration:none;}
.tab-btn.active{background:var(--accent);color:#08201c;}
.tab-btn:hover:not(.active){color:var(--nav-text);}

/* algo subtitle + tables */
.subtitle-meta{font-family:var(--font-display);font-size:12.5px;color:var(--accent-strong);background:var(--accent-soft);display:inline-block;padding:4px 10px;border-radius:20px;margin:0 0 16px;font-weight:600;}
.ex-card .subtitle{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-faint);margin-top:2px;}
.table-wrap{overflow-x:auto;margin:14px 0;}
.dist-table{border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px;width:100%;min-width:420px;}
.dist-table th,.dist-table td{border:1px solid var(--paper-border);padding:7px 11px;text-align:center;}
.dist-table thead th{background:var(--accent-soft);color:var(--accent-strong);font-family:var(--font-display);font-weight:600;}
.dist-table tbody th{background:var(--accent-soft);color:var(--accent-strong);font-family:var(--font-display);font-weight:600;text-align:left;}
.graph-diagram{margin:18px 0;max-width:460px;}
.graph-diagram svg{width:100%;height:auto;display:block;}

/* theme toggle */
.theme-toggle{
  position:fixed;bottom:16px;right:16px;z-index:40;background:var(--paper);border:1px solid var(--paper-border);
  color:var(--ink-soft);border-radius:20px;padding:8px 13px;font-size:12px;font-family:var(--font-display);
  font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Ouvrir la navigation">☰ Menu</button>
<div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <rect x="3" y="9" width="14" height="10" rx="2" stroke="#3FCDB8" stroke-width="2"/>
        <rect x="23" y="21" width="14" height="10" rx="2" stroke="#3FCDB8" stroke-width="2"/>
        <path d="M17 14h4a2 2 0 0 1 2 2v3" stroke="#3FCDB8" stroke-width="2" fill="none"/>
        <path d="M23 26h-4a2 2 0 0 1-2-2v-3" stroke="#3FCDB8" stroke-width="2" fill="none" opacity="0"/>
        <circle cx="30" cy="12" r="1.6" fill="#3FCDB8"/>
        <path d="M23 19l5-5" stroke="#3FCDB8" stroke-width="1.4" stroke-dasharray="2 2"/>
      </svg>
      <div>
        <div class="brand-text">Exercices C</div>
        <div class="brand-sub">Programme MPI</div>
      </div>
    </div>

    <div class="tabs" id="tabSwitch">
      <a href="#" class="tab-btn" data-tab="exercices">Exercices</a>
      <a href="#notions" class="tab-btn" data-tab="notions">Notions</a>
      <a href="#algo" class="tab-btn" data-tab="algorithmes">Algos</a>
    </div>

    <div class="overall-progress">
      <div class="label"><span>Progression (exercices)</span><span id="overallCount">0 / 0</span></div>
      <div class="bar"><span id="overallBar" style="width:0%"></span></div>
    </div>

    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="Rechercher…" autocomplete="off">
    </div>

    <div id="panel-exercices">
      <a href="#" class="home-link" id="homeLink">Accueil</a>
      <nav class="chapters" id="chaptersNav"></nav>
    </div>
    <div id="panel-notions" style="display:none">
      <a href="#notions" class="home-link" id="notionsHomeLink">Accueil notions</a>
      <nav class="chapters" id="notionsNav"></nav>
    </div>
    <div id="panel-algorithmes" style="display:none">
      <a href="#algo" class="home-link" id="algoHomeLink">Accueil algorithmes</a>
      <nav class="chapters" id="algoNav"></nav>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner" id="mainInner"></div>
    <footer class="sitefoot">Site créé pour réviser l'algorithmique et le C du programme MPI — contenu ajouté au fil de l'eau.</footer>
  </main>
</div>

<button class="theme-toggle" id="themeToggle">🌓 Auto</button>

<script>
/* ============================================================
   UTILITAIRES
   ============================================================ */
function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

const KEYWORDS = new Set(['if','else','while','for','do','return','break','continue','switch','case','default','struct','typedef','sizeof','goto']);
const TYPES = new Set(['int','char','float','double','long','short','unsigned','signed','void','static','const','extern','maillon','liste','size_t']);
const CONSTANTS = new Set(['NULL']);

function highlightC(code){
  const escaped = escapeHtml(code);
  const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|(#\s*\w+[^\n]*)|(\b\d+\b)|([A-Za-z_]\w*)/g;
  return escaped.replace(re, function(match, comment, block, str, ch, preproc, num, ident){
    if (comment || block) return '<span class="tok-comment">' + match + '</span>';
    if (str || ch) return '<span class="tok-string">' + match + '</span>';
    if (preproc) return '<span class="tok-preproc">' + match + '</span>';
    if (num) return '<span class="tok-number">' + match + '</span>';
    if (ident){
      if (KEYWORDS.has(ident)) return '<span class="tok-keyword">' + match + '</span>';
      if (TYPES.has(ident)) return '<span class="tok-type">' + match + '</span>';
      if (CONSTANTS.has(ident)) return '<span class="tok-constant">' + match + '</span>';
      return match;
    }
    return match;
  });
}

function codeBlock(raw, id, lang){
  lang = lang || 'c';

/* ---- petit graphe d'exemple, réutilisé par les fiches "plus court chemin" ---- */
const GRAPH_NODES = { A:[50,130], B:[170,55], C:[170,205], D:[300,55], E:[300,205], F:[410,130] };
const GRAPH_EDGES = [['A','B',4],['A','C',2],['B','C',1],['B','D',5],['C','D',8],['C','E',10],['D','E',2],['D','F',6],['E','F',3]];

function edgeKey(u,v){ return [u,v].sort().join('-'); }

function graphSvg(highlightEdges, highlightNodes){
  const hlSet = new Set((highlightEdges || []).map(e => edgeKey(e[0], e[1])));
  const hlNodes = new Set(highlightNodes || []);
  let svg = '<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">';
  GRAPH_EDGES.forEach(function(e){
    const u = e[0], v = e[1], w = e[2];
    const p1 = GRAPH_NODES[u], p2 = GRAPH_NODES[v];
    const on = hlSet.has(edgeKey(u, v));
    const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    svg += '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" stroke="' + (on ? 'var(--accent)' : 'var(--paper-border)') + '" stroke-width="' + (on ? 3 : 1.6) + '"/>';
    svg += '<rect x="' + (mx - 10) + '" y="' + (my - 9) + '" width="20" height="16" fill="var(--paper)"/>';
    svg += '<text x="' + mx + '" y="' + (my + 4) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="' + (on ? 'var(--accent-strong)' : 'var(--ink-faint)') + '">' + w + '</text>';
  });
  Object.keys(GRAPH_NODES).forEach(function(n){
    const p = GRAPH_NODES[n];
    const on = hlNodes.has(n);
    svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="18" fill="' + (on ? 'var(--accent-soft)' : 'var(--paper)') + '" stroke="' + (on ? 'var(--accent)' : 'var(--ink-faint)') + '" stroke-width="2"/>';
    svg += '<text x="' + p[0] + '" y="' + (p[1] + 5) + '" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="14" fill="var(--ink)">' + n + '</text>';
  });
  svg += '</svg>';
  return '<div class="hero-diagram graph-diagram">' + svg + '</div>';
}

function rowTable(rowLabel, nodes, values){
  return '<div class="table-wrap"><table class="dist-table"><thead><tr><th></th>' +

function matrixTable(nodes, matrix){
  let html = '<div class="table-wrap"><table class="dist-table"><thead><tr><th></th>' +
    nodes.map(function(n){ return '<th>' + n + '</th>'; }).join('') + '</tr></thead><tbody>';
  nodes.forEach(function(row, i){
    html += '<tr><th>' + row + '</th>' + matrix[i].map(function(v){ return '<td>' + v + '</td>'; }).join('') + '</tr>';

  html += '</tbody></table></div>';

const PROGRESS_KEY = 'exercices-c-mpi-progress';
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();
function exKey(chapterId, exId){ return chapterId + '/' + exId; }
function isDone(chapterId, exId){ return !!progress[exKey(chapterId, exId)]; }
function setDone(chapterId, exId, val){
  const k = exKey(chapterId, exId);
  if (val) progress[k] = true; else delete progress[k];
  saveProgress(progress);
  updateProgressUI();
}
function updateProgressUI(){
  const total = allExercises().length;
  const done = Object.keys(progress).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const countEl = document.getElementById('overallCount');
  const barEl = document.getElementById('overallBar');
  if (countEl) countEl.textContent = done + ' / ' + total;
  if (barEl) barEl.style.width = pct + '%';
  COURSE.forEach(ch => {
    const el = document.querySelector('[data-chapter-count="' + ch.id + '"]');
    if (el && ch.exercises.length){
      const d = ch.exercises.filter(ex => isDone(ch.id, ex.id)).length;

function wireCopyButtons(){
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', function(){
      const id = btn.getAttribute('data-copy');
      const codeEl = document.getElementById(id);
      if (!codeEl) return;
      const text = codeEl.innerText;
      const done = () => { btn.textContent = 'Copié !'; setTimeout(() => btn.textContent = 'Copier', 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    });
  });
}
function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){}
}

function route(){
  const hash = location.hash.replace(/^#/, '');
  const parts = hash.split('/');
  const filter = document.getElementById('searchInput').value;

  if (parts[0] === 'algo'){
    setActiveTab('algorithmes');
    const sec = ALGO_SECTIONS.find(s => s.id === parts[1]);
    renderSidebarExercices(null, null, filter);
    renderSidebarNotions(null, null, filter);
    if (!sec){
      renderSidebarAlgo(null, null, filter);
      renderAlgoHome();
    } else {
      const algo = parts[2] ? sec.algos.find(a => a.id === parts[2]) : null;
      renderSidebarAlgo(sec.id, algo ? algo.id : null, filter);
      if (algo) renderAlgoDetail(sec, algo);
      else renderAlgoSection(sec);
    }
  } else if (parts[0] === 'notions'){
    setActiveTab('notions');
    const sec = NOTIONS_SECTIONS.find(s => s.id === parts[1]);
    renderSidebarExercices(null, null, filter);
    renderSidebarAlgo(null, null, filter);
    if (!sec){
      renderSidebarNotions(null, null, filter);
      renderNotionsHome();
    } else {
      const notion = parts[2] ? sec.notions.find(n => n.id === parts[2]) : null;
      renderSidebarNotions(sec.id, notion ? notion.id : null, filter);
      if (notion) renderNotionDetail(sec, notion);
      else renderNotionsSection(sec);
    }
  } else {
    setActiveTab('exercices');
    const ch = COURSE.find(c => c.id === parts[0]);
    renderSidebarAlgo(null, null, filter);
    renderSidebarNotions(null, null, filter);
    if (!ch){
      renderSidebarExercices(null, null, filter);
      renderHome();
    } else {
      const ex = parts[1] ? ch.exercises.find(e => e.id === parts[1]) : null;
      renderSidebarExercices(ch.id, ex ? ex.id : null, filter);
      if (ex) renderExercise(ch, ex);
      else renderChapter(ch);
    }
  }
  updateProgressUI();
  window.scrollTo(0,0);
  closeMobileSidebar();
}

window.addEventListener('hashchange', route);

const THEME_KEY = 'exercices-c-mpi-theme';
function applyThemeLabel(){
  const saved = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggle');
  if (saved === 'light') btn.textContent = '☀️ Clair';
  else if (saved === 'dark') btn.textContent = '🌙 Sombre';
  else btn.textContent = '🌓 Auto';
}
try{
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
}catch(e){}
document.getElementById('themeToggle').addEventListener('click', function(){
  const current = document.documentElement.getAttribute('data-theme');
  const nextTheme = current === null ? 'light' : current === 'light' ? 'dark' : null;
  if (nextTheme === null) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', nextTheme);
  try{
    if (nextTheme === null) localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, nextTheme);
  }catch(e){}
  applyThemeLabel();
});
applyThemeLabel();

/* ============================================================
   INITIALISATION
   ============================================================ */
route();

/* ============================================================
   ÉDITION DE CODE (Gestion de la tabulation)
   ============================================================ */
document.addEventListener('keydown', function(e) {
  if (e.target && e.target.tagName === 'CODE' && e.target.isContentEditable) {
    if (e.key === 'Tab') {
      e.preventDefault();
      // Insère 4 espaces à l'emplacement du curseur
      document.execCommand('insertText', false, '    ');
    }
  }
});
</script>
